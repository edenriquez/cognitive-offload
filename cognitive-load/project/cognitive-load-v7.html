<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cognitive Load — Modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --color-white:#ffffff;
    --color-ash:#f3f4f6;
    --color-stone:#e4e7ec;
    --color-slate:#d3d8df;
    --color-lead:#b5bdc9;
    --color-overcast:#8f99a8;
    --color-metal:#6f7988;
    --color-carbon:#505967;
    --color-ink:#1c1d1f;
    --color-abyss:#000000;
    --color-action-blue:#407ff2;
    --color-focus-blue:#94b9ff;
    --color-success-green:#075a39;
    --color-danger-red:#772322;
    --color-warning-yellow:#705500;

    --font-tiempos: 'Newsreader', ui-serif, Georgia, serif;
    --font-inter: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    --radius-cards:8px;
    --radius-inputs:7px;
    --radius-buttons:10px;
    --radius-tags:4px;

    --shadow-subtle:rgb(238,239,241) 0 0 0 1px inset;
    --shadow-subtle-2:rgba(28,40,64,0.1) 0 2px 3px -2px, rgba(28,40,64,0.04) 0 4px 6px -2px;

    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:#dfe3ea;
    background-image:
      radial-gradient(ellipse at 20% 10%, #e8edf3 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #d7dde6 0%, transparent 50%);
    color:var(--color-ink);
    font-family:var(--font-inter);
    font-size:14px;line-height:1.43;
    letter-spacing:-0.14px;
    font-feature-settings:"ss03";
    -webkit-font-smoothing:antialiased;
    height:100vh;overflow:hidden;
    transition:background .4s var(--ease);
  }
  body.immersive{background:var(--color-white);background-image:none;}
    height:100vh;overflow:hidden;
  }

  /* ===== Desktop chrome ===== */
  .desktop{
    position:fixed;inset:0;
    display:grid;grid-template-rows:24px 1fr;
    overflow:hidden;
    transition:padding .4s var(--ease);
  }
  body.immersive .desktop{grid-template-rows:0 1fr;}
  body.immersive .menubar{display:none;}
  body.immersive .window-wrap{padding:0;}
  body.immersive .window{
    max-width:none;max-height:none;
    border-radius:0;
    box-shadow:none;
    grid-template-rows:0 1fr 0;
  }
  body.immersive .titlebar,
  body.immersive .statusbar{display:none;}
  body.immersive .rail{
    background:transparent;
    border-right:none;
  }
  body.immersive .window{background:var(--color-white);}
  .menubar{
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(0,0,0,0.08);
    display:flex;align-items:center;
    padding:0 12px;gap:18px;
    font-size:12px;color:var(--color-ink);
    -webkit-app-region:drag;user-select:none;
  }
  .menubar .mb-logo{
    display:flex;align-items:center;gap:6px;
    font-weight:600;letter-spacing:-0.14px;
  }
  .menubar .mb-logo i{
    width:12px;height:12px;border-radius:3px;
    background:var(--color-ink);display:inline-block;
  }
  .menubar .mb-item{
    color:var(--color-ink);font-weight:400;letter-spacing:-0.14px;
    cursor:default;padding:0 4px;font-size:12px;
  }
  .menubar .mb-item:hover{background:rgba(0,0,0,0.06);border-radius:4px;}
  .menubar .mb-spacer{flex:1;}
  .menubar .mb-status{
    color:var(--color-metal);font-size:11px;
    display:flex;gap:14px;align-items:center;letter-spacing:-0.11px;
  }
  .menubar .mb-status b{color:var(--color-ink);font-weight:500;font-variant-numeric:tabular-nums;}
  .menubar .mb-status .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--color-success-green);
    display:inline-block;margin-right:4px;
  }

  .window-wrap{
    display:grid;place-items:center;
    padding:32px;overflow:hidden;
  }
  .window{
    width:100%;height:100%;max-width:1480px;max-height:920px;
    background:var(--color-white);
    border-radius:12px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.08),
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 24px 60px rgba(28,40,64,0.18),
      0 8px 24px rgba(28,40,64,0.08);
    display:grid;
    grid-template-rows:38px 56px 1fr 28px;
    grid-template-columns:1fr;
    grid-template-areas:
      "title"
      "nav"
      "content"
      "status";
    overflow:hidden;
  }
  .titlebar{
    grid-area:title;
    display:grid;grid-template-columns:120px 1fr 120px;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--color-stone);
    background:linear-gradient(to bottom, #fafbfc, #f3f4f6);
    -webkit-app-region:drag;user-select:none;
  }
  .traffic{display:flex;gap:8px;}
  .traffic .tl{
    width:12px;height:12px;border-radius:50%;
    border:0.5px solid rgba(0,0,0,0.08);cursor:pointer;
    -webkit-app-region:no-drag;
  }
  .tl.red{background:#ff5f57;}
  .tl.yellow{background:#febc2e;}
  .tl.green{background:#28c840;}
  .title-center{
    text-align:center;font-size:13px;font-weight:500;
    color:var(--color-ink);letter-spacing:-0.14px;
  }
  .title-center span{color:var(--color-overcast);font-weight:400;margin-left:8px;}
  .title-right{
    display:flex;justify-content:flex-end;gap:6px;
    -webkit-app-region:no-drag;
  }
  .icon-btn{
    width:24px;height:24px;border-radius:6px;
    display:grid;place-items:center;cursor:pointer;
    color:var(--color-metal);
    transition:background .15s,color .15s;
  }
  .icon-btn:hover{background:var(--color-ash);color:var(--color-ink);}

  /* Top nav (mode bar) */
  .topnav{
    grid-area:nav;
    border-bottom:1px solid var(--color-stone);
    background:var(--color-white);
    display:flex;align-items:center;justify-content:center;
    padding:0 16px;position:relative;
  }
  .nav-brand{
    position:absolute;left:18px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--color-metal);font-weight:500;
    letter-spacing:-0.14px;
  }
  .nav-brand i{
    width:18px;height:18px;border-radius:5px;
    background:var(--color-ink);display:grid;place-items:center;
    color:var(--color-white);font-family:var(--font-tiempos);
    font-size:13px;font-style:italic;line-height:1;
  }
  .nav-pills{
    display:flex;gap:2px;padding:4px;
    background:var(--color-ash);
    border:1px solid var(--color-stone);
    border-radius:99px;
  }
  .nav-pills button{
    padding:6px 16px;border-radius:99px;
    color:var(--color-metal);
    font-size:13px;font-weight:500;letter-spacing:-0.14px;
    transition:color .2s var(--ease), background .2s var(--ease);
  }
  .nav-pills button:hover{color:var(--color-ink);}
  .nav-pills button.on{background:var(--color-ink);color:var(--color-white);}
  .nav-right{
    position:absolute;right:18px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:14px;
    font-size:12px;color:var(--color-overcast);letter-spacing:-0.14px;
  }
  .nav-right b{color:var(--color-ink);font-weight:500;font-variant-numeric:tabular-nums;}
  .auto-hint{font-size:11px;color:var(--color-lead);}

  body.immersive .topnav{
    background:transparent;
    border-bottom:none;
    position:fixed;top:0;left:0;right:0;
    z-index:50;
    opacity:0;pointer-events:none;
    transition:opacity .3s var(--ease);
  }
  body.immersive .topnav:hover,
  body.immersive .topnav.peek{opacity:1;pointer-events:auto;}
  body.immersive .desktop{grid-template-rows:0 0 1fr 0;}

  /* immersive toggle in titlebar */
  .immersive-toggle{
    -webkit-app-region:no-drag;
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:var(--color-overcast);
    cursor:pointer;padding:3px 8px;border-radius:6px;
    transition:background .15s,color .15s;letter-spacing:-0.11px;
  }
  .immersive-toggle:hover{background:var(--color-ash);color:var(--color-ink);}
  .immersive-toggle.on{background:var(--color-ink);color:var(--color-white);}
  .immersive-toggle kbd{
    font-size:10px;font-family:var(--font-inter);
    border:1px solid currentColor;opacity:0.6;
    padding:0 4px;border-radius:3px;
  }

  /* peek hot zone in immersive mode */
  .peek-zone{
    position:fixed;top:0;left:0;right:0;height:8px;z-index:49;
    display:none;
  }
  body.immersive .peek-zone{display:block;}
  .rail{
    grid-area:rail;
    background:#fafbfc;
    border-right:1px solid var(--color-stone);
    display:flex;flex-direction:column;
    padding:16px 10px 12px;
    overflow:hidden;
  }
  .rail-section{
    font-size:10px;font-weight:600;color:var(--color-overcast);
    text-transform:uppercase;letter-spacing:0.06em;
    padding:8px 10px 6px;
  }
  .rail-item{
    display:grid;grid-template-columns:18px 1fr auto;gap:10px;
    align-items:center;
    padding:7px 10px;border-radius:6px;
    font-size:13px;font-weight:500;
    color:var(--color-carbon);letter-spacing:-0.14px;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .rail-item:hover{background:var(--color-ash);color:var(--color-ink);}
  .rail-item.on{background:var(--color-ink);color:var(--color-white);}
  .rail-item.on .rail-icon{color:var(--color-white);}
  .rail-item.on .rail-kbd{color:rgba(255,255,255,0.55);background:rgba(255,255,255,0.1);border-color:transparent;}
  .rail-icon{
    color:var(--color-metal);display:grid;place-items:center;
    width:18px;height:18px;
  }
  .rail-item.on .rail-icon{color:var(--color-white);}
  .rail-kbd{
    font-size:10px;font-weight:500;
    color:var(--color-overcast);
    border:1px solid var(--color-stone);
    background:var(--color-white);
    border-radius:3px;padding:1px 5px;
    font-variant-numeric:tabular-nums;
  }
  .rail-spacer{flex:1;}
  .rail-divider{height:1px;background:var(--color-stone);margin:8px 6px;}

  .rail-card{
    margin:8px 4px 0;
    background:var(--color-white);
    border:1px solid var(--color-stone);
    border-radius:8px;
    padding:12px;
    box-shadow:var(--shadow-subtle-2);
  }
  .rail-card-h{
    font-size:11px;font-weight:600;color:var(--color-overcast);
    text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;
  }
  .rail-card-v{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:24px;font-weight:400;letter-spacing:-0.36px;
    color:var(--color-ink);font-variant-numeric:tabular-nums;
  }
  .rail-card-l{font-size:11px;color:var(--color-metal);margin-top:2px;letter-spacing:-0.11px;}
  .rail-card-bar{
    height:3px;background:var(--color-stone);border-radius:2px;
    margin-top:8px;overflow:hidden;
  }
  .rail-card-bar span{
    display:block;height:100%;background:var(--color-ink);border-radius:2px;
  }

  /* Content + status */
  .content-area{
    grid-area:content;
    background:var(--color-white);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .statusbar{
    grid-area:status;
    border-top:1px solid var(--color-stone);
    background:#fafbfc;
    display:flex;align-items:center;
    padding:0 14px;gap:18px;
    font-size:11px;color:var(--color-metal);letter-spacing:-0.11px;
  }
  .statusbar b{color:var(--color-ink);font-weight:500;font-variant-numeric:tabular-nums;}
  .statusbar .sb-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--color-success-green);display:inline-block;
  }
  .statusbar .sb-dot.warn{background:var(--color-danger-red);animation:pulse 1.6s infinite;}
  .statusbar .sb-spacer{flex:1;}
  .statusbar .sb-link{color:var(--color-action-blue);font-weight:500;cursor:pointer;}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;font-feature-settings:"ss03";}
  input,textarea{font-family:inherit;color:inherit;font-feature-settings:"ss03";}
  ::selection{background:#dfeaff;}

  .serif{font-family:var(--font-tiempos);font-feature-settings:normal;}
  .mono-num{font-variant-numeric:tabular-nums;}

  /* (mode-bar / clock / brand removed — moved into desktop chrome) */

  /* ===== Stage ===== */
  .stage{height:100%;width:100%;overflow-y:auto;overflow-x:hidden;}
  .stage::-webkit-scrollbar{width:0;}

  /* ============================================================
     FOCUS MODE
  ============================================================ */
  .focus{min-height:100%;display:grid;place-items:center;padding:80px 40px;}
  .focus-inner{text-align:center;max-width:780px;width:100%;}
  .focus-eye{
    font-size:12px;font-weight:500;color:var(--color-overcast);
    letter-spacing:-0.14px;margin-bottom:32px;
  }
  .focus-task{
    font-family:var(--font-tiempos);font-weight:400;
    font-size:56px;line-height:1.1;letter-spacing:-1.12px;
    color:var(--color-ink);text-wrap:balance;
    margin-bottom:48px;
    font-feature-settings:normal;
  }
  .focus-timer{
    font-family:var(--font-inter);font-weight:500;
    font-size:96px;line-height:1;letter-spacing:-2.5px;
    color:var(--color-ink);font-variant-numeric:tabular-nums;
    margin-bottom:8px;
  }
  .focus-meta{
    font-size:12px;color:var(--color-overcast);font-weight:400;
    letter-spacing:-0.14px;
  }
  .focus-progress{
    width:360px;height:2px;background:var(--color-stone);
    margin:32px auto 0;position:relative;border-radius:1px;overflow:hidden;
  }
  .focus-progress span{
    position:absolute;left:0;top:0;bottom:0;width:38%;
    background:var(--color-ink);border-radius:1px;
  }
  .focus-actions{display:flex;gap:8px;justify-content:center;margin-top:48px;}
  .focus-reveal{
    margin-top:80px;font-size:12px;color:var(--color-overcast);
    cursor:pointer;letter-spacing:-0.14px;
    border-bottom:1px dashed var(--color-stone);
    padding-bottom:2px;display:inline-block;
  }
  .focus-reveal:hover{color:var(--color-ink);border-bottom-color:var(--color-slate);}
  .focus-why{
    margin-top:18px;font-size:14px;color:var(--color-metal);
    max-width:480px;margin-left:auto;margin-right:auto;
    letter-spacing:-0.14px;
  }
  .focus-why b{color:var(--color-ink);font-weight:500;}
  .focus-why .blue{color:var(--color-action-blue);font-weight:500;}

  /* ============================================================
     TODAY MODE
  ============================================================ */
  .today{min-height:100%;display:grid;place-items:center;padding:80px 40px 60px;}
  .today-inner{width:100%;max-width:660px;}
  .today-greet{
    font-size:13px;color:var(--color-overcast);font-weight:500;
    letter-spacing:-0.14px;text-align:center;margin-bottom:12px;
  }
  .today-q{
    font-family:var(--font-tiempos);font-weight:400;
    font-size:40px;line-height:1.1;letter-spacing:-0.6px;
    color:var(--color-ink);text-align:center;
    text-wrap:balance;margin-bottom:64px;
    font-feature-settings:normal;
  }
  .today-q em{font-style:italic;color:var(--color-metal);font-weight:400;}

  .ttasks{display:flex;flex-direction:column;}
  .ttask{
    display:grid;grid-template-columns:90px 1fr auto;gap:20px;
    align-items:center;padding:20px 4px;
    border-bottom:1px solid var(--color-stone);
  }
  .ttask:first-child{border-top:1px solid var(--color-stone);}
  .ttask-rank{
    font-size:11px;color:var(--color-overcast);font-weight:500;
    letter-spacing:-0.11px;text-transform:uppercase;
  }
  .ttask-rank.must{color:var(--color-ink);}
  .ttask-rank.personal{color:var(--color-action-blue);}
  .ttask-text{
    font-size:16px;color:var(--color-ink);font-weight:400;
    letter-spacing:-0.24px;line-height:1.5;
  }
  .ttask.done .ttask-text{color:var(--color-lead);text-decoration:line-through;}
  .ttask-check{
    width:18px;height:18px;border:1.5px solid var(--color-slate);
    border-radius:50%;cursor:pointer;
    display:grid;place-items:center;
    transition:background .2s,border-color .2s;
  }
  .ttask.done .ttask-check{
    background:var(--color-success-green);border-color:var(--color-success-green);
  }
  .ttask.done .ttask-check::after{
    content:'';width:5px;height:8px;
    border-right:1.5px solid var(--color-white);
    border-bottom:1.5px solid var(--color-white);
    transform:rotate(45deg) translate(-1px,-1px);
  }

  /* primary CTA, Attio style */
  .btn-primary{
    background:var(--color-ink);color:var(--color-white);
    border:1px solid var(--color-ink);
    padding:8px 12px;border-radius:var(--radius-buttons);
    font-size:14px;font-weight:500;letter-spacing:-0.14px;
    cursor:pointer;transition:background .15s, border-color .15s;
  }
  .btn-primary:hover{background:#000;border-color:#000;}
  .btn-secondary{
    background:var(--color-white);color:var(--color-ink);
    border:1px solid var(--color-slate);
    padding:8px 12px;border-radius:var(--radius-buttons);
    font-size:14px;font-weight:500;letter-spacing:-0.14px;
    cursor:pointer;transition:background .15s,border-color .15s;
  }
  .btn-secondary:hover{background:var(--color-ash);}

  .ttask-go{
    background:transparent;color:var(--color-metal);
    border:1px solid var(--color-stone);
    padding:6px 12px;border-radius:var(--radius-buttons);
    font-size:13px;font-weight:500;letter-spacing:-0.14px;
    cursor:pointer;
    opacity:0;transition:opacity .2s,background .15s,color .15s,border-color .15s;
  }
  .ttask:hover .ttask-go{opacity:1;}
  .ttask-go:hover{background:var(--color-ash);color:var(--color-ink);}
  .ttask.active .ttask-go{
    opacity:1;background:var(--color-ink);color:var(--color-white);
    border-color:var(--color-ink);
  }
  .ttask.active .ttask-go:hover{background:#000;}

  .reveal-row{display:flex;justify-content:center;gap:8px;margin-top:64px;}
  .reveal-pill{
    background:transparent;color:var(--color-metal);
    border:1px solid var(--color-stone);
    padding:6px 14px;border-radius:99px;
    font-size:12px;font-weight:500;letter-spacing:-0.14px;
    cursor:pointer;transition:background .15s, color .15s, border-color .15s;
  }
  .reveal-pill:hover{background:var(--color-ash);color:var(--color-ink);}
  .reveal-pill.on{background:var(--color-ink);color:var(--color-white);border-color:var(--color-ink);}

  .reveal-content{
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .4s var(--ease), opacity .3s var(--ease), margin .3s var(--ease);
  }
  .reveal-content.on{max-height:600px;opacity:1;margin-top:32px;}

  .ring-row{
    display:flex;gap:32px;align-items:center;justify-content:center;
    background:var(--color-white);
    border:1px solid var(--color-stone);
    border-radius:var(--radius-cards);
    padding:20px 28px;
    box-shadow:var(--shadow-subtle-2);
  }
  .ring-legend{
    display:grid;grid-template-columns:auto auto;gap:8px 16px;
    font-size:13px;color:var(--color-metal);letter-spacing:-0.14px;
  }
  .ring-legend span{display:flex;align-items:center;gap:8px;}
  .ring-legend i{width:8px;height:8px;border-radius:2px;}
  .ring-legend b{color:var(--color-ink);font-weight:500;font-variant-numeric:tabular-nums;}

  .ctx-line{
    text-align:center;font-size:12px;color:var(--color-overcast);
    margin-top:14px;letter-spacing:-0.14px;
  }
  .ctx-line .danger{color:var(--color-danger-red);font-weight:500;}

  /* ============================================================
     CAPTURE
  ============================================================ */
  .capture{min-height:100%;display:grid;place-items:center;padding:80px 40px 60px;}
  .capture-inner{width:100%;max-width:680px;}
  .capture-eye{
    text-align:center;font-size:12px;color:var(--color-overcast);
    font-weight:500;letter-spacing:-0.14px;margin-bottom:24px;
  }
  .capture-input{
    width:100%;background:transparent;border:none;outline:none;
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:40px;font-weight:400;
    color:var(--color-ink);text-align:center;
    padding:14px 0;
    border-bottom:1px solid var(--color-stone);
    transition:border-bottom-color .2s;
    letter-spacing:-0.6px;line-height:1.1;
  }
  .capture-input:focus{border-bottom-color:var(--color-ink);}
  .capture-input::placeholder{color:var(--color-lead);font-style:italic;}
  .capture-hint{
    text-align:center;font-size:12px;color:var(--color-overcast);
    margin-top:16px;letter-spacing:-0.14px;
  }
  .capture-hint kbd{
    border:1px solid var(--color-stone);
    background:var(--color-ash);
    padding:1px 6px;border-radius:4px;
    font-family:var(--font-inter);font-size:11px;
    color:var(--color-carbon);
  }
  .capture-recent{margin-top:60px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .capture-recent-row{
    font-size:14px;color:var(--color-overcast);
    transition:color .3s;letter-spacing:-0.14px;
  }
  .capture-recent-row:hover{color:var(--color-ink);}
  .capture-recent-row.fresh{color:var(--color-ink);font-weight:500;}
  .capture-recent-row .age{color:var(--color-lead);font-size:12px;margin-left:8px;}

  /* ============================================================
     REVIEW
  ============================================================ */
  .review{padding:60px 48px 80px;min-height:100%;}
  .review-inner{max-width:1080px;margin:0 auto;}
  .review-h{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-weight:400;font-size:40px;line-height:1.1;letter-spacing:-0.6px;
    color:var(--color-ink);margin-bottom:6px;
  }
  .review-sub{
    font-size:14px;color:var(--color-overcast);font-weight:400;
    letter-spacing:-0.14px;margin-bottom:40px;
  }
  .review-summary{
    display:grid;grid-template-columns:repeat(4,1fr);
    border:1px solid var(--color-stone);
    border-radius:var(--radius-cards);
    background:var(--color-white);
    box-shadow:var(--shadow-subtle-2);
    overflow:hidden;
    margin-bottom:48px;
  }
  .rs-cell{padding:20px 24px;border-right:1px solid var(--color-stone);}
  .rs-cell:last-child{border-right:none;}
  .rs-v{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:32px;line-height:1.1;letter-spacing:-0.6px;
    color:var(--color-ink);font-variant-numeric:tabular-nums;
  }
  .rs-v.danger{color:var(--color-danger-red);}
  .rs-l{font-size:13px;color:var(--color-overcast);margin-top:6px;letter-spacing:-0.14px;}

  .section{margin-top:56px;}
  .section-h{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:28px;font-weight:400;letter-spacing:-0.42px;line-height:1.23;
    color:var(--color-ink);margin-bottom:20px;
  }

  /* energy map */
  .em-card{
    background:var(--color-white);
    border:1px solid var(--color-stone);
    border-radius:var(--radius-cards);
    padding:24px;
    box-shadow:var(--shadow-subtle-2);
  }
  .em{display:grid;grid-template-rows:1fr 24px;height:200px;}
  .em-area{position:relative;border-bottom:1px solid var(--color-stone);}
  .em-region{
    position:absolute;top:0;bottom:0;
    background:rgba(119,35,34,0.05);
    border-left:1px dashed rgba(119,35,34,0.3);
    border-right:1px dashed rgba(119,35,34,0.3);
  }
  .em-region-label{
    position:absolute;top:-18px;left:6px;
    font-size:11px;color:var(--color-danger-red);
    font-weight:500;letter-spacing:-0.11px;white-space:nowrap;
  }
  .em-bar{
    position:absolute;bottom:0;width:4px;
    background:var(--color-slate);border-radius:1px 1px 0 0;
    transform:translateX(-50%);
  }
  .em-bar.peak{background:var(--color-ink);}
  .em-bar.warn{background:var(--color-danger-red);}
  .em-x{position:relative;}
  .em-x span{
    position:absolute;top:6px;font-size:11px;
    color:var(--color-overcast);transform:translateX(-50%);
    letter-spacing:-0.11px;
  }
  .em-now{
    position:absolute;top:0;bottom:0;width:1px;
    background:var(--color-action-blue);
  }
  .em-now::after{
    content:'NOW';position:absolute;top:-16px;left:-15px;
    font-size:10px;color:var(--color-action-blue);
    font-weight:600;letter-spacing:0.04em;
  }

  /* patterns */
  .patterns{border-top:1px solid var(--color-stone);}
  .pat{
    display:grid;grid-template-columns:120px 1fr 110px;
    gap:20px;padding:20px 4px;
    border-bottom:1px solid var(--color-stone);
    align-items:baseline;
  }
  .pat-tag{
    font-size:11px;color:var(--color-overcast);font-weight:500;
    letter-spacing:-0.11px;text-transform:uppercase;
  }
  .pat-tag.high{color:var(--color-danger-red);}
  .pat-title{
    font-size:16px;color:var(--color-ink);font-weight:500;
    letter-spacing:-0.24px;
  }
  .pat-detail{
    font-size:14px;color:var(--color-metal);margin-top:4px;
    letter-spacing:-0.14px;line-height:1.43;
  }
  .pat-window{
    font-size:12px;color:var(--color-overcast);text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:-0.14px;
  }

  /* leaks */
  .leaks{border-top:1px solid var(--color-stone);}
  .leak{
    display:grid;grid-template-columns:130px 80px 1fr 1fr;
    gap:20px;padding:14px 4px;
    border-bottom:1px solid var(--color-stone);
    font-size:14px;align-items:center;letter-spacing:-0.14px;
  }
  .leak-time{color:var(--color-overcast);font-variant-numeric:tabular-nums;}
  .leak-cost{color:var(--color-danger-red);font-weight:500;font-variant-numeric:tabular-nums;}
  .leak-cause{color:var(--color-ink);}
  .leak-fix{color:var(--color-action-blue);font-weight:500;}

  /* tomorrow CTA card on review */
  .tom-card{
    background:var(--color-ash);
    border:1px solid var(--color-stone);
    border-radius:var(--radius-cards);
    padding:24px 28px;margin-top:48px;
    display:grid;grid-template-columns:1fr auto;
    gap:24px;align-items:center;
  }
  .tom-eye{
    font-size:11px;color:var(--color-overcast);font-weight:500;
    letter-spacing:-0.11px;margin-bottom:8px;text-transform:uppercase;
  }
  .tom-line{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:20px;line-height:1.3;letter-spacing:-0.4px;
    color:var(--color-ink);
  }
  .tom-line b{font-weight:500;color:var(--color-ink);}

  /* ============================================================
     TOMORROW
  ============================================================ */
  .tomorrow{min-height:100%;display:grid;place-items:center;padding:80px 40px 60px;}
  .tomorrow-inner{max-width:640px;width:100%;}
  .tom-h{
    text-align:center;font-size:13px;color:var(--color-overcast);
    font-weight:500;letter-spacing:-0.14px;margin-bottom:14px;
  }
  .tom-headline{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    font-size:40px;line-height:1.1;letter-spacing:-0.6px;font-weight:400;
    color:var(--color-ink);text-align:center;text-wrap:balance;
    margin-bottom:48px;
  }
  .tom-list{display:flex;flex-direction:column;}
  .tom-item{
    display:grid;grid-template-columns:32px 1fr;gap:18px;
    padding:18px 4px;
    border-bottom:1px solid var(--color-stone);
    align-items:baseline;
  }
  .tom-item:first-child{border-top:1px solid var(--color-stone);}
  .tom-rank{
    font-size:11px;color:var(--color-overcast);font-weight:500;
    letter-spacing:-0.11px;
  }
  .tom-rank.locked{color:var(--color-action-blue);}
  .tom-task{
    font-size:16px;color:var(--color-ink);font-weight:500;
    letter-spacing:-0.24px;line-height:1.4;
  }
  .tom-meta{
    font-size:12px;color:var(--color-overcast);margin-top:6px;
    letter-spacing:-0.14px;
  }
  .tom-meta b{color:var(--color-ink);font-weight:500;}
  .tom-cta{display:flex;gap:8px;justify-content:center;margin-top:40px;}

  /* ===== Enforcement: signal strip ===== */
  .signals{
    display:flex;align-items:center;gap:0;
    padding:10px 32px;
    background:var(--color-white);
    border-bottom:1px solid var(--color-stone);
    font-size:12px;letter-spacing:-0.14px;
    overflow-x:auto;
  }
  .signal{
    display:flex;align-items:center;gap:8px;
    padding:0 18px;border-right:1px solid var(--color-stone);
    color:var(--color-metal);
  }
  .signal:last-child{border-right:none;}
  .signal:first-child{padding-left:0;}
  .signal b{color:var(--color-ink);font-weight:500;font-variant-numeric:tabular-nums;}
  .signal .sd{
    width:6px;height:6px;border-radius:50%;
    background:var(--color-success-green);
  }
  .signal .sd.warn{background:var(--color-warning-yellow);}
  .signal .sd.danger{background:var(--color-danger-red);animation:pulse 1.6s infinite;}
  .signal .sd.idle{background:var(--color-lead);}
  .signal-label{font-size:10px;color:var(--color-overcast);text-transform:uppercase;letter-spacing:0.04em;}

  /* ===== Intervention overlay (blocking) ===== */
  .blocker{
    position:fixed;inset:0;z-index:100;
    background:rgba(28,29,31,0.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    display:grid;place-items:center;padding:32px;
    animation:fadein .3s var(--ease);
  }
  @keyframes fadein{ from{opacity:0;} to{opacity:1;} }
  .blocker-card{
    width:100%;max-width:520px;
    background:var(--color-white);
    border-radius:12px;
    box-shadow:0 24px 60px rgba(0,0,0,0.3);
    overflow:hidden;
  }
  .blocker-eye{
    padding:20px 28px 0;
    font-size:11px;font-weight:600;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--color-danger-red);
    display:flex;align-items:center;gap:8px;
  }
  .blocker-eye .pulse-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--color-danger-red);animation:pulse 1.6s infinite;
  }
  .blocker-rule{
    padding:6px 28px 0;font-size:11px;color:var(--color-overcast);
    font-family:'Menlo',monospace;letter-spacing:0;
  }
  .blocker-h{
    font-family:var(--font-tiempos);font-feature-settings:normal;
    padding:14px 28px 8px;
    font-size:28px;font-weight:400;letter-spacing:-0.42px;line-height:1.23;
    color:var(--color-ink);
  }
  .blocker-body{
    padding:0 28px 22px;font-size:14px;color:var(--color-metal);
    line-height:1.5;letter-spacing:-0.14px;
  }
  .blocker-body b{color:var(--color-ink);font-weight:500;}
  .blocker-evidence{
    margin:8px 28px 22px;padding:14px 16px;
    background:var(--color-ash);border-radius:8px;
    font-size:13px;color:var(--color-ink);line-height:1.5;letter-spacing:-0.14px;
  }
  .blocker-evidence ul{margin:6px 0 0;padding-left:18px;color:var(--color-metal);}
  .blocker-evidence li{margin-bottom:3px;}
  .blocker-actions{
    display:flex;gap:8px;justify-content:flex-end;
    padding:14px 22px;border-top:1px solid var(--color-stone);
    background:#fafbfc;
  }
  .blocker-override{
    color:var(--color-overcast);font-size:12px;
    padding:8px 12px;cursor:pointer;
    border-radius:var(--radius-buttons);
  }
  .blocker-override:hover{color:var(--color-danger-red);}

  /* ===== Cold-start gate ===== */
  .gate-card{
    margin:16px 0 0;padding:14px 18px;
    background:#fff8e6;
    border:1px solid #f1d97c;
    border-radius:8px;
    display:flex;align-items:center;gap:14px;
    font-size:13px;color:#705500;letter-spacing:-0.14px;
  }
  .gate-card b{color:var(--color-ink);font-weight:500;}

  /* warning chip on tasks */
  .warn-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff0ef;color:var(--color-danger-red);
    padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;
    margin-left:8px;letter-spacing:-0.11px;
  }

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%) translateY(120%);
    background:var(--color-white);
    border:1px solid var(--color-stone);
    border-radius:99px;padding:10px 16px;
    display:flex;gap:14px;align-items:center;
    font-size:14px;color:var(--color-ink);
    z-index:60;letter-spacing:-0.14px;
    transition:transform .4s var(--ease);
    box-shadow:var(--shadow-subtle-2);
  }
  .toast.on{transform:translateX(-50%) translateY(0);}
  .toast-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--color-danger-red);
    animation:pulse 1.6s infinite;
  }
  .toast-action{
    font-size:13px;color:var(--color-action-blue);
    font-weight:500;cursor:pointer;
    padding-left:12px;border-left:1px solid var(--color-stone);
    letter-spacing:-0.14px;
  }
  .toast-action.muted{color:var(--color-overcast);}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(119,35,34,0.4);}
    50%{box-shadow:0 0 0 6px rgba(119,35,34,0);}
  }

  /* focus mode dims rail */
  body.in-focus .rail-item:not(.on){opacity:0.4;}
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ============================================================
// ENFORCEMENT ENGINE
// Rules defined in spec — produce interventions from real-time signals.
// ============================================================
const SIGNALS_INITIAL = {
  activeThreads: 3,
  newThreadsLast10min: 5,
  orphanThreads: 4,
  errorRate: 2.8,         // multiple of baseline
  errorRateFirst15: 0.7,  // for cold-start
  baseline: 1.0,
  inactivityMin: 0,
  postLunchDrop: 0.65,    // % drop
  stuckTaskMin: 252,      // 4h12m
  taskProgress: 0.08,
  openLoops: 4,
  cutoffHour: 16.5,
  inPeak: false,
  peakWastedOnLowImpact: false,
  hasDailyPlan: true,
  workActualPct: 78,
  workPlannedPct: 60,
};

function evaluateRules(s, hour, mode){
  // produces a list of interventions, sorted by severity
  const out = [];
  // 1. Cold start
  if (!s.hasDailyPlan){
    out.push({ id:'no-plan', sev:'block', rule:'COLD_START.NO_PLAN',
      title:'Define your day before starting work.',
      body:'You have not defined any MUST tasks for today. Execution is blocked until a plan exists.',
      evidence:['0 must-win tasks defined','0 personal task defined'],
      action:{label:'Plan today', kind:'plan'},
    });
  }
  if (s.errorRateFirst15 > 0.5 && hour < 10){
    out.push({ id:'env-broken', sev:'block', rule:'COLD_START.ENV',
      title:'Fix your environment before starting.',
      body:'Cold-start errors are above threshold. Deep work is blocked.',
      evidence:[`error rate first 15min: ${(s.errorRateFirst15*100).toFixed(0)}%`,'5 cold-start errors detected','same pattern 3 of last 5 days'],
      action:{label:'Run pre-flight', kind:'preflight'},
    });
  }
  // 2. Thread control
  if (s.newThreadsLast10min >= 5){
    out.push({ id:'thrashing', sev:'block', rule:'THREAD.THRASHING',
      title:'You are thrashing. Resume previous thread or stop.',
      body:'New threads are blocked. Resume one of the open threads or take a break.',
      evidence:[`${s.newThreadsLast10min} new threads in last 10 min`,`${s.activeThreads} active threads`,`${s.orphanThreads} orphans`],
      action:{label:'Triage threads', kind:'triage'},
    });
  } else if (s.activeThreads >= 1 && mode==='capture'){
    // captured prompt to start new thread blocked
  }
  if (s.orphanThreads >= 3){
    out.push({ id:'orphans', sev:'warn', rule:'THREAD.ORPHANS',
      title:'You are abandoning threads instead of resolving them.',
      body:`${s.orphanThreads} single-message threads were never resumed. Resolve or archive.`,
      evidence:[`orphan count: ${s.orphanThreads}`,'avg time-to-abandon: 47s','last 5 days trend ↑'],
      action:{label:'Review orphans', kind:'orphans'},
    });
  }
  // 3. Cognitive load
  if (s.errorRate > s.baseline * 2){
    out.push({ id:'fatigue', sev:'warn', rule:'LOAD.FATIGUE',
      title:'You are working under fatigue.',
      body:`Error rate is ${s.errorRate.toFixed(1)}× baseline. Quality is collapsing.`,
      evidence:[`baseline: ${s.baseline}`,`current: ${s.errorRate.toFixed(2)}`,'last 30 min: 9 errors'],
      action:{label:'Take 15m break', kind:'break'},
    });
  }
  if (s.stuckTaskMin > 90 && s.taskProgress < 0.2){
    out.push({ id:'stuck', sev:'warn', rule:'LOAD.STUCK',
      title:'Stuck task — split or redefine.',
      body:'Long duration with low progress. Checkpoint or break it down.',
      evidence:[`${Math.floor(s.stuckTaskMin/60)}h${s.stuckTaskMin%60}m on retry-logic v2`,`progress: ${(s.taskProgress*100).toFixed(0)}%`,'1 commit, 9 AI msgs'],
      action:{label:'Split task', kind:'split'},
    });
  }
  if (s.inactivityMin > 45){
    out.push({ id:'blackhole', sev:'warn', rule:'LOAD.BLACK_HOLE',
      title:'Break or stuck?',
      body:`${s.inactivityMin} min of inactivity during work hours.`,
      evidence:[`last input: ${s.inactivityMin}m ago`],
      action:{label:'Resume', kind:'resume'},
      action2:{label:'Took a break', kind:'break-ack'},
    });
  }
  // 4. Energy
  if (hour >= 13.5 && hour < 15 && s.postLunchDrop > 0.6){
    out.push({ id:'crash', sev:'warn', rule:'ENERGY.POST_LUNCH',
      title:'Post-lunch crash — switch to light tasks.',
      body:`Activity dropped ${(s.postLunchDrop*100).toFixed(0)}%. Walk or do admin until 15:00.`,
      evidence:['baseline activity: 84/h','current: 29/h','pattern repeats 4 of 5 days'],
      action:{label:'Switch to admin', kind:'admin'},
    });
  }
  // 5. Cutoff
  if (hour > s.cutoffHour){
    out.push({ id:'cutoff', sev:'block', rule:'CUTOFF.PAST',
      title:'Past cognitive cutoff. Only closing tasks allowed.',
      body:`Cutoff is ${s.cutoffHour.toFixed(1).replace('.5',':30')}. New complex work is blocked. Close loops, then stop.`,
      evidence:[`current: ${Math.floor(hour)}:${Math.floor((hour%1)*60).toString().padStart(2,'0')}`,'error rate +180% past cutoff','3 open loops to close'],
      action:{label:'Show open loops', kind:'loops'},
    });
  }
  // 6. Open loops
  if (s.openLoops >= 5){
    out.push({ id:'loops', sev:'block', rule:'LOOPS.OVERFLOW',
      title:'Too many open loops.',
      body:`${s.openLoops} unresolved threads. New threads blocked.`,
      evidence:[`open: ${s.openLoops}`,'oldest: 4d ago','none triaged today'],
      action:{label:'Close loops', kind:'loops'},
    });
  }
  // 8. Auto-replan
  if (s.workActualPct > s.workPlannedPct + 10){
    out.push({ id:'overwork', sev:'info', rule:'REPLAN.OVERWORK',
      title:'Work actual exceeds plan.',
      body:`Tomorrow's bandwidth will be auto-shifted: work ${s.workPlannedPct} → ${s.workPlannedPct - 10}%, personal +10%.`,
      evidence:[`actual: ${s.workActualPct}%`,`planned: ${s.workPlannedPct}%`,'3rd consecutive day'],
      action:{label:'Accept', kind:'accept'},
    });
  }
  return out;
}

function severityRank(sev){ return sev==='block' ? 0 : sev==='warn' ? 1 : 2; }

// ============================================================

function suggestedMode(hour){
  if (hour < 9) return 'tomorrow';
  if (hour < 17) return 'today';
  if (hour < 20) return 'review';
  return 'today';
}

// ---------- Bandwidth ring ----------
function Ring({ alloc, size = 96 }){
  const cats = [
    { id:'work',     v: alloc.work,     c:'#1c1d1f' },
    { id:'personal', v: alloc.personal, c:'#407ff2' },
    { id:'admin',    v: alloc.admin,    c:'#8f99a8' },
    { id:'learning', v: alloc.learning, c:'#d3d8df' },
  ];
  const r = (size - 12) / 2;
  const cx = size/2, cy = size/2;
  const C = 2 * Math.PI * r;
  let acc = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f3f4f6" strokeWidth="6"/>
      {cats.map(s => {
        const len = (s.v/100)*C;
        const dash = `${len} ${C-len}`;
        const off = -acc;
        acc += len;
        return (
          <circle key={s.id} cx={cx} cy={cy} r={r} fill="none"
            stroke={s.c} strokeWidth="6"
            strokeDasharray={dash} strokeDashoffset={off}
            transform={`rotate(-90 ${cx} ${cy})`}/>
        );
      })}
      <text x={cx} y={cy-2} textAnchor="middle" dominantBaseline="middle"
            fontFamily="Newsreader, serif" fontSize="20" fill="#1c1d1f" fontWeight="400">
        6h
      </text>
      <text x={cx} y={cy+14} textAnchor="middle" dominantBaseline="middle"
            fontFamily="Inter, sans-serif" fontSize="10" fill="#8f99a8" letterSpacing="0">
        today
      </text>
    </svg>
  );
}

// ---------- FOCUS ----------
function FocusMode({ task, onExit }){
  const [secs, setSecs] = useState(22*60+14);
  const [showWhy, setShowWhy] = useState(false);
  useEffect(() => {
    document.body.classList.add('in-focus');
    const t = setInterval(() => setSecs(s => Math.max(0, s-1)), 1000);
    return () => { clearInterval(t); document.body.classList.remove('in-focus'); };
  }, []);
  const m = Math.floor(secs/60), s = secs%60;
  return (

function CaptureMode({ items, setItems }){
  const [draft, setDraft] = useState('');
  const ref = useRef(null);
  useEffect(() => { setTimeout(() => ref.current?.focus(), 100); }, []);
  const submit = () => {
    if (!draft.trim()) return;
    setItems(arr => [{ id: Math.random().toString(36).slice(2), text: draft.trim(), fresh:true, age:'just now' }, ...arr.map(i => ({...i, fresh:false}))]);
    setDraft('');
  };
  return (
    <div className="capture">
      <div className="capture-inner">
        <div className="capture-eye">Capture · no thinking required</div>
        <input ref={ref} className="capture-input" placeholder="what's on your mind…"

function EnergyMap(){
  const buckets = useMemo(() => {
    const arr = [];
    for (let i=0; i<90; i++){
      const h = 7 + i/6;
      let v;
      if (h<8.5) v=25+Math.random()*15;
      else if (h<11.5) v=70+Math.random()*22;
      else if (h<12.5) v=45+Math.random()*20;
      else if (h<13.5) v=8+Math.random()*8;
      else if (h<14.5) v=30+Math.random()*15;
      else if (h<15.5) v=55+Math.random()*20;
      else if (h<16.5) v=65+Math.random()*15;
      else if (h<18) v=50+Math.random()*15;
      else v=18+Math.random()*12;
      const errors = (h>=14.5 && h<15.5) || (h>=17 && h<18);
      arr.push({ h, v, errors });
    }
    return arr;
  }, []);
  const w = 100/buckets.length;
  return (
    <div className="em">
      <div className="em-area">
        <div className="em-region" style={{left:`${(13-7)/15*100}%`,width:`${1/15*100}%`}}>
          <span className="em-region-label">lunch · black hole</span>
        </div>
        <div className="em-region" style={{left:`${(14.5-7)/15*100}%`,width:`${1/15*100}%`}}>
          <span className="em-region-label">thrashing</span>
        </div>
        <div className="em-region" style={{left:`${(16.5-7)/15*100}%`,width:`${1.5/15*100}%`}}>
          <span className="em-region-label">past cutoff</span>
        </div>
        {buckets.map((b,i) => (
          <span key={i} className={`em-bar ${b.v>65?'peak':b.errors?'warn':''}`}
            style={{ left:`${i*w + w/2}%`, height:`${(b.v/100)*100}%` }}></span>
        ))}
        <span className="em-now" style={{left:`${(14.6-7)/15*100}%`}}></span>
      </div>
      <div className="em-x">
        {[7,9,11,13,15,17,19,21].map(h => (
          <span key={h} style={{left:`${(h-7)/15*100}%`}}>{h.toString().padStart(2,'0')}:00</span>
        ))}
      </div>
    </div>
  );
}

            <div className="blocker-body">{blocker.body}</div>
            <div className="blocker-evidence">
              <span style={{fontSize:11,fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--color-overcast)'}}>Evidence</span>
              <ul>{blocker.evidence.map((e,i)=>(<li key={i}>{e}</li>))}</ul>
            </div>
            <div className="blocker-actions">
              <span className="blocker-override" onClick={()=>{ setOverrideUsed(n=>n+1); setDismissed(d=>({...d,[blocker.id]:true})); }}>Override (logged)</span>
              <button className="btn-secondary" onClick={()=>setDismissed(d=>({...d,[blocker.id]:'snooze'}))}>Snooze 5m</button>
              <button className="btn-primary" onClick={()=>{
                setDismissed(d=>({...d,[blocker.id]:true}));
                if (blocker.action.kind==='triage'||blocker.action.kind==='loops'||blocker.action.kind==='orphans') setMode('capture');
                if (blocker.action.kind==='break') setMode('focus');
                if (blocker.action.kind==='plan') setMode('today');
                if (blocker.action.kind==='accept') setMode('tomorrow');
                if (blocker.action.kind==='admin') setMode('today');
              }}>{blocker.action.label}</button>
            </div>
          </div>
        </div>
      )}

      {toast && mode!=='focus' && !immersive && !blocker && (
        <div className="toast on">
          <span className="toast-dot"></span>
          <span>{toast.msg}</span>
          <button className="toast-action" onClick={() => setToast(null)}>{toast.action}</button>
          <button className="toast-action muted" onClick={() => setToast(null)}>Dismiss</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
