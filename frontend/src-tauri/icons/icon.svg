<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#0e0e16"/>
    </linearGradient>

    <!-- Corona outer glow — wide warm bloom -->
    <radialGradient id="corona-outer" cx="512" cy="512" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4956a" stop-opacity="0"/>
      <stop offset="55%" stop-color="#c4804a" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#d4956a" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#e8b080" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e8b080" stop-opacity="0"/>
    </radialGradient>

    <!-- Corona ring — the bright edge -->
    <radialGradient id="corona-ring" cx="512" cy="512" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#e8a060" stop-opacity="0.5"/>
      <stop offset="86%" stop-color="#f0c888" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#fff0d8" stop-opacity="1"/>
      <stop offset="94%" stop-color="#f0c888" stop-opacity="0.85"/>
      <stop offset="98%" stop-color="#d08850" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c07840" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner shadow — the dark disk -->
    <radialGradient id="disk" cx="512" cy="512" r="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="85%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#08080c" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Diamond ring flare — the bright point -->
    <radialGradient id="flare" cx="385" cy="385" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#fff8e8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f0d0a0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8b070" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft rays -->
    <radialGradient id="rays" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a870" stop-opacity="0"/>
      <stop offset="60%" stop-color="#e8a870" stop-opacity="0"/>
      <stop offset="80%" stop-color="#d09060" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c08050" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Faint radial light rays from corona -->
  <g opacity="0.35">
    <line x1="512" y1="512" x2="512" y2="120" stroke="#d09868" stroke-width="1.5" opacity="0.15"/>
    <line x1="512" y1="512" x2="820" y2="200" stroke="#d09868" stroke-width="1" opacity="0.1"/>
    <line x1="512" y1="512" x2="900" y2="512" stroke="#d09868" stroke-width="1.5" opacity="0.12"/>
    <line x1="512" y1="512" x2="800" y2="830" stroke="#d09868" stroke-width="1" opacity="0.1"/>
    <line x1="512" y1="512" x2="512" y2="900" stroke="#d09868" stroke-width="1.5" opacity="0.12"/>
    <line x1="512" y1="512" x2="200" y2="800" stroke="#d09868" stroke-width="1" opacity="0.1"/>
    <line x1="512" y1="512" x2="130" y2="512" stroke="#d09868" stroke-width="1.5" opacity="0.12"/>
    <line x1="512" y1="512" x2="220" y2="210" stroke="#d09868" stroke-width="1" opacity="0.1"/>
    <!-- Diagonal rays -->
    <line x1="512" y1="512" x2="710" y2="140" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="880" y2="350" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="870" y2="700" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="660" y2="890" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="340" y2="880" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="140" y2="680" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="150" y2="340" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
    <line x1="512" y1="512" x2="320" y2="150" stroke="#d09868" stroke-width="0.8" opacity="0.06"/>
  </g>

  <!-- Corona outer bloom -->
  <circle cx="512" cy="512" r="340" fill="url(#corona-outer)"/>

  <!-- Corona ring — the luminous edge -->
  <circle cx="512" cy="512" r="220" fill="url(#corona-ring)"/>

  <!-- Secondary corona wisps — asymmetric streaks for realism -->
  <g opacity="0.3" fill="none" stroke-linecap="round">
    <!-- Upper-left wisp -->
    <path d="M400,390 C350,340 310,300 280,260"
      stroke="#e8b880" stroke-width="3" opacity="0.4"/>
    <path d="M410,380 C370,330 340,290 320,250"
      stroke="#f0c890" stroke-width="1.5" opacity="0.5"/>
    <!-- Upper-right wisp -->
    <path d="M620,400 C670,350 710,310 740,270"
      stroke="#e8b880" stroke-width="2.5" opacity="0.35"/>
    <path d="M630,390 C680,340 720,300 750,260"
      stroke="#f0c890" stroke-width="1.5" opacity="0.45"/>
    <!-- Lower-right wisp -->
    <path d="M630,630 C670,670 710,720 740,770"
      stroke="#d0a070" stroke-width="2.5" opacity="0.3"/>
    <path d="M620,640 C660,680 700,730 720,760"
      stroke="#e0b080" stroke-width="1.5" opacity="0.4"/>
    <!-- Lower-left wisp -->
    <path d="M390,620 C340,670 300,710 260,750"
      stroke="#d0a070" stroke-width="3" opacity="0.35"/>
    <path d="M400,630 C350,680 310,720 280,760"
      stroke="#e0b080" stroke-width="1.5" opacity="0.45"/>
  </g>

  <!-- Dark center disk — the void of focus -->
  <circle cx="512" cy="512" r="175" fill="url(#disk)"/>

  <!-- Thin bright corona edge — sharp inner rim -->
  <circle cx="512" cy="512" r="178" fill="none" stroke="#f0d0a0" stroke-width="2" opacity="0.7"/>
  <circle cx="512" cy="512" r="182" fill="none" stroke="#e8b878" stroke-width="1" opacity="0.3"/>

  <!-- Diamond ring effect — bright flare at upper-left edge -->
  <circle cx="385" cy="385" r="40" fill="url(#flare)"/>
  <circle cx="385" cy="385" r="6" fill="#ffffff" opacity="0.95"/>
  <circle cx="385" cy="385" r="3" fill="#ffffff"/>

  <!-- Secondary smaller flare — opposite side, dimmer -->
  <circle cx="625" cy="645" r="18" fill="url(#flare)" opacity="0.3"
    transform="translate(113,133) scale(0.5) translate(-113,-133)"/>
  <circle cx="632" cy="632" r="2.5" fill="#ffffff" opacity="0.5"/>

  <!-- Faint dust/star specks in the background -->
  <g fill="#ffffff">
    <circle cx="160" cy="180" r="1.2" opacity="0.25"/>
    <circle cx="860" cy="160" r="1.0" opacity="0.2"/>
    <circle cx="880" cy="860" r="1.2" opacity="0.25"/>
    <circle cx="150" cy="840" r="1.0" opacity="0.2"/>
    <circle cx="300" cy="140" r="0.8" opacity="0.15"/>
    <circle cx="750" cy="130" r="0.8" opacity="0.15"/>
    <circle cx="900" cy="440" r="1.0" opacity="0.2"/>
    <circle cx="120" cy="580" r="0.8" opacity="0.15"/>
    <circle cx="440" cy="900" r="0.8" opacity="0.15"/>
    <circle cx="600" cy="130" r="1.0" opacity="0.18"/>
    <circle cx="130" cy="400" r="0.8" opacity="0.15"/>
    <circle cx="890" cy="620" r="0.8" opacity="0.15"/>
    <circle cx="780" cy="880" r="0.8" opacity="0.12"/>
    <circle cx="220" cy="880" r="0.8" opacity="0.12"/>
  </g>
</svg>
