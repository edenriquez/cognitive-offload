<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="100%" stop-color="#101018"/>
    </linearGradient>

    <!-- Core glow -->
    <radialGradient id="core-glow" cx="512" cy="512" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#e8a87c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8a87c" stop-opacity="0"/>
    </radialGradient>

    <!-- Tendril gradients — warm center to cool tips -->
    <linearGradient id="t1" x1="512" y1="512" x2="512" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#c77dba"/>
      <stop offset="100%" stop-color="#6b8cce"/>
    </linearGradient>
    <linearGradient id="t2" x1="512" y1="512" x2="820" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#d4789b"/>
      <stop offset="100%" stop-color="#7b8fd0"/>
    </linearGradient>
    <linearGradient id="t3" x1="512" y1="512" x2="860" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#c47db8"/>
      <stop offset="100%" stop-color="#6898c4"/>
    </linearGradient>
    <linearGradient id="t4" x1="512" y1="512" x2="700" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#b880be"/>
      <stop offset="100%" stop-color="#6b8cce"/>
    </linearGradient>
    <linearGradient id="t5" x1="512" y1="512" x2="280" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#d07ca0"/>
      <stop offset="100%" stop-color="#7c94d2"/>
    </linearGradient>
    <linearGradient id="t6" x1="512" y1="512" x2="160" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#c882b6"/>
      <stop offset="100%" stop-color="#6d90cc"/>
    </linearGradient>
    <linearGradient id="t7" x1="512" y1="512" x2="240" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8a87c"/><stop offset="50%" stop-color="#bc80b8"/>
      <stop offset="100%" stop-color="#758ec8"/>
    </linearGradient>

    <!-- Synapse node glow -->
    <radialGradient id="node-glow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e8c8a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8a87c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Very faint ambient warmth at center -->
  <circle cx="512" cy="512" r="320" fill="url(#core-glow)"/>

  <!-- === Dendrite tendrils — organic curves radiating from center === -->
  <g fill="none" stroke-linecap="round">

    <!-- Tendril 1: up -->
    <path d="M512,512 C508,440 490,380 510,310 C530,240 500,190 510,160"
      stroke="url(#t1)" stroke-width="5" opacity="0.8"/>
    <path d="M510,310 C540,290 570,250 600,230"
      stroke="url(#t1)" stroke-width="3" opacity="0.5"/>
    <path d="M510,310 C480,280 450,260 430,230"
      stroke="url(#t1)" stroke-width="2.5" opacity="0.4"/>

    <!-- Tendril 2: upper-right -->
    <path d="M512,512 C560,480 620,440 680,380 C740,320 790,280 820,250"
      stroke="url(#t2)" stroke-width="5" opacity="0.8"/>
    <path d="M680,380 C710,360 750,370 780,350"
      stroke="url(#t2)" stroke-width="3" opacity="0.5"/>
    <path d="M680,380 C700,410 730,400 760,420"
      stroke="url(#t2)" stroke-width="2" opacity="0.35"/>

    <!-- Tendril 3: right -->
    <path d="M512,512 C570,520 640,540 720,550 C790,555 830,570 860,580"
      stroke="url(#t3)" stroke-width="5" opacity="0.75"/>
    <path d="M720,550 C740,520 770,500 800,490"
      stroke="url(#t3)" stroke-width="2.5" opacity="0.4"/>

    <!-- Tendril 4: lower-right -->
    <path d="M512,512 C540,570 560,640 590,710 C620,770 670,820 700,850"
      stroke="url(#t4)" stroke-width="5" opacity="0.8"/>
    <path d="M590,710 C620,700 650,720 680,710"
      stroke="url(#t4)" stroke-width="3" opacity="0.45"/>
    <path d="M590,710 C570,740 560,770 540,790"
      stroke="url(#t4)" stroke-width="2.5" opacity="0.4"/>

    <!-- Tendril 5: lower-left -->
    <path d="M512,512 C480,570 440,630 390,700 C340,760 300,790 280,800"
      stroke="url(#t5)" stroke-width="5" opacity="0.8"/>
    <path d="M390,700 C370,680 340,690 310,680"
      stroke="url(#t5)" stroke-width="3" opacity="0.5"/>
    <path d="M390,700 C410,730 400,760 420,790"
      stroke="url(#t5)" stroke-width="2" opacity="0.35"/>

    <!-- Tendril 6: left -->
    <path d="M512,512 C450,508 380,490 310,500 C240,510 190,515 160,520"
      stroke="url(#t6)" stroke-width="5" opacity="0.75"/>
    <path d="M310,500 C290,470 260,460 230,450"
      stroke="url(#t6)" stroke-width="2.5" opacity="0.4"/>
    <path d="M310,500 C295,530 270,550 240,570"
      stroke="url(#t6)" stroke-width="2" opacity="0.35"/>

    <!-- Tendril 7: upper-left -->
    <path d="M512,512 C470,470 420,410 360,340 C300,280 260,260 240,260"
      stroke="url(#t7)" stroke-width="5" opacity="0.8"/>
    <path d="M360,340 C340,360 310,350 280,360"
      stroke="url(#t7)" stroke-width="3" opacity="0.45"/>
    <path d="M360,340 C380,310 370,280 360,250"
      stroke="url(#t7)" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- === Synapse nodes — glowing dots at branch points and tips === -->
  <g>
    <!-- Main branch points -->
    <circle cx="510" cy="310" r="7" fill="url(#node-glow)"/>
    <circle cx="680" cy="380" r="7" fill="url(#node-glow)"/>
    <circle cx="720" cy="550" r="6" fill="url(#node-glow)"/>
    <circle cx="590" cy="710" r="7" fill="url(#node-glow)"/>
    <circle cx="390" cy="700" r="7" fill="url(#node-glow)"/>
    <circle cx="310" cy="500" r="6" fill="url(#node-glow)"/>
    <circle cx="360" cy="340" r="7" fill="url(#node-glow)"/>

    <!-- Tips — smaller, cooler -->
    <circle cx="510" cy="160" r="4.5" fill="#8ba8d8" opacity="0.8"/>
    <circle cx="600" cy="230" r="3.5" fill="#8ba8d8" opacity="0.6"/>
    <circle cx="430" cy="230" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="820" cy="250" r="4.5" fill="#8ba8d8" opacity="0.8"/>
    <circle cx="780" cy="350" r="3.5" fill="#8ba8d8" opacity="0.6"/>
    <circle cx="760" cy="420" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="860" cy="580" r="4.5" fill="#8ba8d8" opacity="0.75"/>
    <circle cx="800" cy="490" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="700" cy="850" r="4.5" fill="#8ba8d8" opacity="0.8"/>
    <circle cx="680" cy="710" r="3.5" fill="#8ba8d8" opacity="0.6"/>
    <circle cx="540" cy="790" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="280" cy="800" r="4.5" fill="#8ba8d8" opacity="0.8"/>
    <circle cx="310" cy="680" r="3.5" fill="#8ba8d8" opacity="0.6"/>
    <circle cx="420" cy="790" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="160" cy="520" r="4.5" fill="#8ba8d8" opacity="0.75"/>
    <circle cx="230" cy="450" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="240" cy="570" r="3" fill="#8ba8d8" opacity="0.5"/>
    <circle cx="240" cy="260" r="4.5" fill="#8ba8d8" opacity="0.8"/>
    <circle cx="280" cy="360" r="3.5" fill="#8ba8d8" opacity="0.55"/>
    <circle cx="360" cy="250" r="3" fill="#8ba8d8" opacity="0.5"/>
  </g>

  <!-- === Central core — the focused mind === -->
  <!-- Warm halo rings -->
  <circle cx="512" cy="512" r="44" fill="none" stroke="#e8a87c" stroke-width="1" opacity="0.2"/>
  <circle cx="512" cy="512" r="32" fill="none" stroke="#e8c09c" stroke-width="1" opacity="0.3"/>

  <!-- Inner glow -->
  <circle cx="512" cy="512" r="22" fill="#e8a87c" opacity="0.35"/>
  <circle cx="512" cy="512" r="14" fill="#f0d0b0" opacity="0.7"/>
  <circle cx="512" cy="512" r="8" fill="#fff4e8" opacity="0.9"/>
  <circle cx="512" cy="512" r="4" fill="#ffffff"/>
</svg>
